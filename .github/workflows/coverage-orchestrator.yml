# =============================================================================
# Coverage Orchestrator — Containerized, SHA-pinned, reproducible coverage runs
# =============================================================================
#
# STRATEGY:
#   - Each repo job runs INSIDE a pinned .NET SDK Docker container.
#     This isolates the build environment per repo without modifying the
#     cloned repo's tree at all.
#   - All actions, target-repo refs, and the runner image are pinned to SHAs.
#   - Coverage strategy (chosen per repo so we never modify .csproj files):
#       * coverlet.collector ALREADY in repo  -> dotnet test --collect:"XPlat Code Coverage"
#         (aspnetcore, orleans, semantic-kernel)
#       * coverlet NOT in repo                -> dotnet-coverage external collector
#         (abp, efcore, roslyn, runtime)
#   - Tests are run "the way each team runs them" (only integration/E2E filters).
#   - Both HTML reports and raw cobertura XML are uploaded as artifacts.
#   - continue-on-error on test steps so reportgenerator still runs on failures.
#
# ACTION PINS (annotated with the version they came from):
#   actions/checkout         11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
#   actions/upload-artifact  b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
#   actions/cache            1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
#
# TARGET REPO PINS (resolved 2026-04-30):
#   abp             ea4bbb8b517869a9fb735ea5bc05c819c209d0b5  (tag 10.0.2)
#   aspnetcore      ecb199c29cbefb6fcb6aa789436de36e44427a78  (release/10.0)
#   efcore          45e3af0273b71919189367bc152a335b69f443c6  (release/10.0)
#   orleans         8024faf860549cb960b4b573c1571b379e283daa  (tag v10.0.0)
#   roslyn          02d301627ed5016a4c18acd1a35e5bbc20ff03f0  (release/dev18.3 tip)
#   runtime         9ffface2f3fa6fbbb427793c3230b1626a1fdd84  (tag v10.0.2)
#   semantic-kernel 0c898161a355b0a845aea48de79cb43e2e9435d2  (tag dotnet-1.70.0)
# =============================================================================

name: Coverage Orchestrator

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (or 'all' for all 7)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - abp
          - aspnetcore
          - efcore
          - orleans
          - roslyn
          - runtime
          - semantic-kernel

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level env: container shorthand and tool versions in one place.
env:
  SDK_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0-noble"
  REPORTGENERATOR_VERSION: "5.4.5"
  DOTNET_COVERAGE_VERSION: "18.6.2"

jobs:

  # ===========================================================================
  # ABP Framework — external dotnet-coverage (no coverlet in repo)
  # ===========================================================================
  abp:
    name: "Coverage: ABP"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 60
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'abp'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone ABP at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/abpframework/abp.git target
          cd target
          git fetch --depth 1 origin ea4bbb8b517869a9fb735ea5bc05c819c209d0b5
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-abp-ea4bbb8b
          restore-keys: nuget-abp-

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage --version ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Build ABP framework
        working-directory: target/framework
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Run tests with coverage
        working-directory: target/framework
        continue-on-error: true
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet-coverage collect \
            "dotnet test --no-build --filter \"FullyQualifiedName!~SkiaSharp&Category!=IntegrationTests\"" \
            -f cobertura -o TestResults/coverage.cobertura.xml

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/framework/TestResults/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-abp
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-abp
          path: target/framework/TestResults/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # ASP.NET Core — built-in coverlet.collector
  # ===========================================================================
  aspnetcore:
    name: "Coverage: ASP.NET Core"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 180
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'aspnetcore'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone ASP.NET Core at pinned SHA (with submodules)
        run: |
          git clone --filter=blob:none https://github.com/dotnet/aspnetcore.git target
          cd target
          git fetch --depth 1 origin ecb199c29cbefb6fcb6aa789436de36e44427a78
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-aspnetcore-ecb199c2
          restore-keys: nuget-aspnetcore-

      - name: Restore SDK & dependencies (./restore.sh + activate.sh)
        shell: bash
        working-directory: target
        run: |
          chmod +x restore.sh activate.sh eng/build.sh
          ./restore.sh
          # activate.sh sets DOTNET_ROOT to the locally-pinned SDK; persist it
          # so subsequent steps in this job pick up the right dotnet.
          source ./activate.sh
          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"

      - name: Build ASP.NET Core (no tests, no Java)
        working-directory: target
        # --no-build-java avoids the Java SignalR client subproject which
        # requires a JDK not present in mcr.microsoft.com/dotnet/sdk:10.0-noble.
        run: ./eng/build.sh --all --no-build-java --no-test

      - name: Run tests with coverage
        working-directory: target
        continue-on-error: true
        run: |
          dotnet test AspNetCore.slnx --no-build \
            --filter "Category!=Integration&Category!=E2E&Category!=Quarantined" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/TestResults/*/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-aspnetcore
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-aspnetcore
          path: target/TestResults/*/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # EF Core — external dotnet-coverage (no coverlet in repo)
  # ===========================================================================
  efcore:
    name: "Coverage: EF Core"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 180
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'efcore'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone EF Core at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/dotnet/efcore.git target
          cd target
          git fetch --depth 1 origin 45e3af0273b71919189367bc152a335b69f443c6
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-efcore-45e3af02
          restore-keys: nuget-efcore-

      - name: Restore SDK & dependencies (./restore.sh + activate.sh)
        shell: bash
        working-directory: target
        run: |
          chmod +x restore.sh activate.sh
          ./restore.sh
          source ./activate.sh
          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage --version ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Run tests with coverage (skipping the 37k SQLite functional suite)
        working-directory: target
        continue-on-error: true
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet-coverage collect \
            "dotnet test EFCore.sln --filter \"FullyQualifiedName!~FunctionalTests&Category!=Integration\"" \
            -f cobertura -o TestResults/coverage.cobertura.xml

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/TestResults/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-efcore
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-efcore
          path: target/TestResults/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Orleans — built-in coverlet.collector
  # ===========================================================================
  orleans:
    name: "Coverage: Orleans"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 90
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'orleans'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone Orleans at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/dotnet/orleans.git target
          cd target
          git fetch --depth 1 origin 8024faf860549cb960b4b573c1571b379e283daa
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-orleans-8024faf8
          restore-keys: nuget-orleans-

      - name: Run tests with coverage
        working-directory: target
        continue-on-error: true
        run: |
          dotnet restore Orleans.slnx
          dotnet test Orleans.slnx \
            --filter "Category!=Integration&Category!=BVT" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/TestResults/*/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-orleans
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-orleans
          path: target/TestResults/*/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Roslyn — external dotnet-coverage (no coverlet in repo)
  # ===========================================================================
  roslyn:
    name: "Coverage: Roslyn"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 180
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'roslyn'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone Roslyn at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/dotnet/roslyn.git target
          cd target
          git fetch --depth 1 origin 02d301627ed5016a4c18acd1a35e5bbc20ff03f0
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-roslyn-02d30162
          restore-keys: nuget-roslyn-

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage --version ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Run tests with coverage
        working-directory: target
        continue-on-error: true
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet-coverage collect \
            "dotnet test Roslyn.slnx --filter \"FullyQualifiedName!~LanguageServer&TargetFrameworkIdentifier!=.NETFramework&Category!=IntegrationTest\"" \
            -f cobertura -o TestResults/coverage.cobertura.xml

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/TestResults/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-roslyn
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-roslyn
          path: target/TestResults/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # .NET Runtime — external dotnet-coverage + native build deps
  # ===========================================================================
  runtime:
    name: "Coverage: .NET Runtime"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 240
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'runtime'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Install native build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm lld lldb \
            libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev libunwind8-dev \
            pigz cpio python3
          rm -rf /var/lib/apt/lists/*

      - name: Disk usage (start)
        run: df -h

      - name: Clone .NET Runtime at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/dotnet/runtime.git target
          cd target
          git fetch --depth 1 origin 9ffface2f3fa6fbbb427793c3230b1626a1fdd84
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-runtime-9ffface2
          restore-keys: nuget-runtime-

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage --version ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Build & test runtime libraries (with coverage)
        working-directory: target
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          chmod +x build.sh
          # dotnet-coverage follows child processes spawned by build.sh's test runners.
          # libs+libs.tests subset = managed-only build (no native CoreCLR compilation).
          dotnet-coverage collect \
            "./build.sh -subset libs+libs.tests -test" \
            -f cobertura -o ./TestResults/coverage.cobertura.xml

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report (best-effort)
        if: always()
        shell: bash
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          shopt -s globstar nullglob
          # Look for coverage in both the dotnet-coverage output AND the artifacts/ tree
          mapfile -t reports < <(find target -type f -name 'coverage.cobertura.xml' 2>/dev/null)
          if [ "${#reports[@]}" -gt 0 ]; then
            reportgenerator \
              -reports:"target/**/coverage.cobertura.xml" \
              -targetdir:"CoverageReport" \
              -reporttypes:Html
          else
            echo "WARN: no cobertura XML produced"
            mkdir -p CoverageReport
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-runtime
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-runtime
          path: |
            target/TestResults/coverage.cobertura.xml
            target/artifacts/**/coverage.cobertura.xml
            target/artifacts/TestResults/**/*.trx
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Semantic Kernel — built-in coverlet.collector
  # ===========================================================================
  semantic-kernel:
    name: "Coverage: Semantic Kernel"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 60
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'semantic-kernel'
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Disk usage (start)
        run: df -h

      - name: Clone Semantic Kernel at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/microsoft/semantic-kernel.git target
          cd target
          git fetch --depth 1 origin 0c898161a355b0a845aea48de79cb43e2e9435d2
          git checkout FETCH_HEAD

      - name: Restore NuGet cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-semantic-kernel-0c898161
          restore-keys: nuget-semantic-kernel-

      - name: Build Semantic Kernel
        working-directory: target/dotnet
        run: dotnet build SK-dotnet.slnx

      - name: Run tests with coverage
        working-directory: target/dotnet
        continue-on-error: true
        run: |
          dotnet test SK-dotnet.slnx --no-build \
            --filter "FullyQualifiedName~UnitTests|FullyQualifiedName~.Tests." \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/dotnet/TestResults/*/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-semantic-kernel
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-semantic-kernel
          path: target/dotnet/TestResults/*/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Summary — runs after all repo jobs (success or failure)
  # ===========================================================================
  summary:
    name: "Coverage Summary"
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - abp
      - aspnetcore
      - efcore
      - orleans
      - roslyn
      - runtime
      - semantic-kernel
    steps:
      - name: Print summary
        run: |
          {
            echo "## Coverage Orchestrator Results"
            echo ""
            echo "| Repository | Status |"
            echo "|---|---|"
            echo "| ABP Framework      | ${{ needs.abp.result }} |"
            echo "| ASP.NET Core       | ${{ needs.aspnetcore.result }} |"
            echo "| EF Core            | ${{ needs.efcore.result }} |"
            echo "| Orleans            | ${{ needs.orleans.result }} |"
            echo "| Roslyn             | ${{ needs.roslyn.result }} |"
            echo "| .NET Runtime       | ${{ needs.runtime.result }} |"
            echo "| Semantic Kernel    | ${{ needs.semantic-kernel.result }} |"
            echo ""
            echo "Artifacts: coverage-report-* (HTML) and coverage-xml-* (raw cobertura)."
          } >> "$GITHUB_STEP_SUMMARY"
