        run: dotnet restore Garnet.slnx

      - name: Build Garnet.slnx
        shell: bash
        working-directory: target
        run: dotnet build Garnet.slnx -c Debug --no-restore

      # Garnet test projects don't follow the *.Tests.csproj suffix convention —
      # they're under test/ as Garnet.test, Garnet.test.cluster, Garnet.fuzz.
      # Garnet.test is the main NUnit unit-test suite. Cluster tests need a multi-
      # node cluster (integration-shaped). Fuzz is non-deterministic. Run only
      # Garnet.test with the standard exclusion filter.
      - name: Run tests with coverage (Garnet.test only)
        shell: bash
        working-directory: target
        continue-on-error: true
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet test test/Garnet.test/Garnet.test.csproj --no-build \
            --filter "FullyQualifiedName!~FunctionalTests&FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~E2E&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~Stress&FullyQualifiedName!~Cluster&Category!=Integration&Category!=IntegrationTest&Category!=IntegrationTests&Category!=E2E&Category!=EndToEnd&Category!=Functional&Category!=FunctionalTests&Category!=Stress&Category!=Performance&Category!=Quarantined&Category!=Flaky" \
            --collect "Code Coverage;Format=cobertura" \
            --results-directory TestResults \
            || echo "::warning::Garnet.test failed or runner pressure — continuing"
          dotnet-coverage merge -r -f cobertura \
            -o TestResults/coverage.cobertura.xml \
            "TestResults/*.cobertura.xml" || echo "merge produced no output"

      - uses: ./.github/actions/validate-cobertura
        if: always()
        with:
          working-directory: target

      - name: Disk usage (end)
        if: always()
        run: df -h

      - uses: ./.github/actions/cobertura-report-and-upload
        if: always()
        with:
          repo-name: garnet
          working-directory: target
          reportgenerator-version: ${{ env.REPORTGENERATOR_VERSION }}

