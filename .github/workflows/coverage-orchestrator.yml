          git checkout FETCH_HEAD

      - uses: ./.github/actions/restore-nuget-cache
        with:
          repo-name: eShop
          sha-prefix: 9b4f9434

      - uses: ./.github/actions/install-dotnet-coverage
        with:
          version: ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Write coverlet.runsettings
        # R6 (2026-05-08): coverlet.console (R5) was a silent no-op on .NET 10
        # MTP hosts. Switch to `dotnet test --collect:"XPlat Code Coverage"
        # --settings coverlet.runsettings`. eShop's MSTest.Sdk-based tests
        # transitively reference coverlet.collector through Microsoft.NET.Test
        # .Sdk; the XPlat collector hooks the SDK pipeline (not vstest CLR
        # profiler attach), which works under MTP.
        shell: bash
        working-directory: target
        run: |
          cat > coverlet.runsettings <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat code coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[eShop*]*,[Ordering*]*,[Basket*]*,[Catalog*]*,[Identity*]*,[Webhooks*]*</Include>
                    <Exclude>[*Tests]*,[*UnitTests]*,[xunit*]*,[Moq*]*,[NSubstitute*]*</Exclude>
