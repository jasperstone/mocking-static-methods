  # ===========================================================================
  # OpenRA — external dotnet-coverage; .NET 8 SDK side-installed
  # ===========================================================================
  # OpenRA targets net8.0 (Directory.Build.props) and the noble SDK 10 image
  # ships only .NET 10. `dotnet-install.sh --channel 8.0` puts an SDK 8 next
  # to the container's SDK 10 (no global.json in the repo to pin against, so
  # we just install the latest 8.0 LTS). Test project (`OpenRA.Test`) uses
  # NUnit 4 + NUnit3TestAdapter and does NOT reference coverlet.collector,
  # so we use the data-collector path with `Code Coverage;Format=cobertura`
  # (same pattern as abp/efcore/roslyn/runtime).
  OpenRA:
    name: "Coverage: OpenRA"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 360
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'OpenRA'
    steps:
      - name: Checkout orchestrator repo (for local composite actions)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: ./.github/actions/setup-workspace

      - name: Clone OpenRA at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/OpenRA/OpenRA.git target
          cd target
          git fetch --depth 1 origin 8f2138c71106aaffd8a288b56d1c9ef6013700ba
          git checkout FETCH_HEAD

      - uses: ./.github/actions/restore-nuget-cache
        with:
          repo-name: OpenRA
          sha-prefix: 8f2138c7

      - uses: ./.github/actions/install-dotnet-coverage
        with:
          version: ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Install .NET 8 SDK (OpenRA targets net8.0)
        shell: bash
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
          dotnet --list-sdks

      - name: Restore + build OpenRA.Test
        shell: bash
        working-directory: target
        run: |
          dotnet restore OpenRA.Test/OpenRA.Test.csproj
          dotnet build OpenRA.Test/OpenRA.Test.csproj -c Release --no-restore

      - name: Run tests with coverage
        shell: bash
        working-directory: target
        continue-on-error: true
        # NUnit project, no coverlet.collector → data-collector path with cobertura
        # output. Standard upstream filter to skip integration/E2E/perf categories
        # (most won't apply but keeps the pattern consistent across repos).
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet test OpenRA.Test/OpenRA.Test.csproj --no-build -c Release \
            --filter "FullyQualifiedName!~FunctionalTests&FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~E2E&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~Stress&Category!=Integration&Category!=IntegrationTest&Category!=IntegrationTests&Category!=E2E&Category!=EndToEnd&Category!=Functional&Category!=FunctionalTests&Category!=Stress&Category!=Performance&Category!=Quarantined&Category!=Flaky" \
            --collect "Code Coverage;Format=cobertura" \
            --results-directory TestResults || true
          dotnet-coverage merge -r -f cobertura \
            -o TestResults/coverage.cobertura.xml \
            "TestResults/*.cobertura.xml" || echo "merge produced no output"

      - uses: ./.github/actions/validate-cobertura
        if: always()
        with:
          working-directory: target

      - name: Disk usage (end)
        if: always()
        run: df -h

      - uses: ./.github/actions/cobertura-report-and-upload
        if: always()
        with:
          repo-name: OpenRA
          working-directory: target
          reportgenerator-version: ${{ env.REPORTGENERATOR_VERSION }}

  # ===========================================================================
  # SQL Tools Service / Bitwarden Server — built-in coverlet; SDK 8.0 pin
  # ===========================================================================
  # NOTE: The local clone path `cloned_repos/server/` actually holds the
  # bitwarden/server repo (the "server" name was assigned during cloning and
  # stuck). bitwarden-server.sln + the test project layout matches that repo,
  # not microsoft/sqltoolsservice. Pinned to bitwarden/server here for fidelity
  # with the local clone Mode-1 analysis was performed against.
  server:
    name: "Coverage: Server (Bitwarden)"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 360
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'server'
    steps:
      - name: Checkout orchestrator repo (for local composite actions)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: ./.github/actions/setup-workspace

      - name: Clone Bitwarden Server at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/bitwarden/server.git target
          cd target
          git fetch --depth 1 origin ea233580d24734f78feffe7fa5cef185b1a2df28
          git checkout FETCH_HEAD

      - uses: ./.github/actions/restore-nuget-cache
        with:
          repo-name: server
          sha-prefix: ea233580

      - name: Install pinned .NET 8 SDK from global.json
        # Bitwarden's global.json pins SDK 8.0.100 latestFeature; the noble
        # container ships .NET 10. Install .NET 8 alongside via dotnet-install.sh
        # so `dotnet build`/`dotnet test` resolve the pinned MSBuild.
        shell: bash
        working-directory: target
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --jsonfile global.json --install-dir "$GITHUB_WORKSPACE/.dotnet"
          echo "DOTNET_ROOT=$GITHUB_WORKSPACE/.dotnet" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.dotnet" >> "$GITHUB_PATH"
          dotnet --list-sdks

      # bitwarden/server sets TreatWarningsAsErrors=true and enables NuGet audit,
      # so any moderate-or-higher CVE in a transitive package (e.g. MailKit 4.14.0
      # NU1902) fails restore. We disable NuGet audit for this job and explicitly
      # remove NU1902 from the warnings-as-errors set as a belt-and-suspenders.
      # Run 25527102157 / server: failed at `dotnet restore bitwarden-server.sln`.
      #
      # APPROACH: Per-csproj restore+build of test/*.Test.csproj (unit suites
      # only, IntegrationTest excluded). The sln pulls in `util/Seeder` which
      # references `util/RustSdk/RustSdk.csproj`; RustSdk has a PreBuild target
      # invoking `cargo build --release` — the SDK container has no Rust toolchain
      # (MSB3073, exit 127). Since RustSdk is referenced by Seeder ONLY (verified
      # against the local clone at cloned_repos/server) and Seeder is not a test
      # project, scoping to the test/*.Test.csproj graph entirely sidesteps it.
      # Run 25495265941 / server: RustSdk.csproj cargo build failure.
      - name: Restore + build unit-test projects
        shell: bash
        working-directory: target
        run: |
          mapfile -t PROJECTS < <(find test -type f -name "*.Test.csproj" \
            ! -name "*.IntegrationTest.csproj" \
            ! -name "Common.csproj" \
            ! -name "IntegrationTestCommon.csproj" \
            | sort -u)
          echo "Discovered ${#PROJECTS[@]} test projects:"
          printf '  %s\n' "${PROJECTS[@]}"
          for proj in "${PROJECTS[@]}"; do
            echo "::group::Restore+Build $(basename "$proj")"
            dotnet restore "$proj" \
              -p:NuGetAudit=false \
              -p:WarningsNotAsErrors=NU1902 \
              || echo "::warning::Restore of $proj failed — continuing"
            dotnet build "$proj" -c Debug --no-restore \
              -p:NuGetAudit=false \
              -p:WarningsNotAsErrors=NU1902 \
              || echo "::warning::Build of $proj failed — continuing"
            echo "::endgroup::"
          done

      # Per-csproj test invocation. coverlet.collector is referenced by every
      # *.Test.csproj transitively via test/Common.csproj, so XPlat Code Coverage
      # works in-process without coverlet.console.
      - name: Run tests with coverage
        shell: bash
        working-directory: target
        continue-on-error: true
        run: |
          mkdir -p TestResults
          FILTER='FullyQualifiedName!~FunctionalTests&FullyQualifiedName!~IntegrationTest&FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~E2E&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~Stress&Category!=Integration&Category!=IntegrationTest&Category!=IntegrationTests&Category!=E2E&Category!=EndToEnd&Category!=Functional&Category!=FunctionalTests&Category!=Stress&Category!=Performance&Category!=Quarantined&Category!=Flaky'
          mapfile -t PROJECTS < <(find test -type f -name "*.Test.csproj" \
            ! -name "*.IntegrationTest.csproj" \
            ! -name "Common.csproj" \
            ! -name "IntegrationTestCommon.csproj" \
            | sort -u)
          for proj in "${PROJECTS[@]}"; do
            echo "::group::Running $(basename "$proj")"
            dotnet test "$proj" --no-build \
              --filter "$FILTER" \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults \
              || echo "::warning::Tests in $(basename "$proj") failed or runner pressure — continuing"
            echo "::endgroup::"
          done

      - uses: ./.github/actions/validate-cobertura
        if: always()
        with:
          working-directory: target

      - name: Disk usage (end)
        if: always()
        run: df -h

      - uses: ./.github/actions/cobertura-report-and-upload
        if: always()
        with:
          repo-name: server
          working-directory: target
          cobertura-glob: TestResults/*/coverage.cobertura.xml
          reportgenerator-version: ${{ env.REPORTGENERATOR_VERSION }}

  # ===========================================================================
  # StockSharp — coverlet.console (MSTest 4.x silent no-op fallback)
  # ===========================================================================
  # StockSharp/Tests/Tests.csproj imports common_target_tests.props which
  # resolves to TargetFrameworks=net10.0 (NetVer=10 in common_versions.props).
  # MSTest 4.x ships under MSTest.Sdk and routes through Microsoft.Testing.
  # Platform; the legacy `--collect "Code Coverage;Format=cobertura"` data
  # collector is silently ignored (tests run, cobertura is a 178-byte empty
  # stub). Run 25552132370 confirmed: 4239 passed, 13 failed, 178-byte file.
  # Switch to coverlet.console (mono.cecil instrumentation, runner-agnostic).
  # Same pattern as Avalonia / eShop. Built assembly is StockSharp.Tests.dll
  # under Tests/bin/Release/net10.0/. The Tests project pulls
  # Microsoft.Data.SqlClient + Ecng.Data.SqlServer; SQL-bound test cases will
  # fail in isolation and are filtered by Category=Integration / Stress etc.
  # No private NuGet feed config (default nuget.org for Ecng.* packages).
  StockSharp:
    name: "Coverage: StockSharp"
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    timeout-minutes: 360
    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'StockSharp'
    steps:
      - name: Checkout orchestrator repo (for local composite actions)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: ./.github/actions/setup-workspace

      - name: Clone StockSharp at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/StockSharp/StockSharp.git target
          cd target
          git fetch --depth 1 origin a26ce597cab73fe07949e0cc3845216342d33484
          git checkout FETCH_HEAD

      - uses: ./.github/actions/restore-nuget-cache
        with:
          repo-name: StockSharp
          sha-prefix: a26ce597

      - uses: ./.github/actions/install-dotnet-coverage
        with:
          version: ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Restore + build Tests project
        shell: bash
        working-directory: target
        # Per-csproj restore + build (StockSharp_Tests.slnx pulls 22 projects
        # including BasketSecurity etc.; restoring the whole graph adds drag.
        # Tests.csproj has the ProjectReferences it needs and will pull them
        # transitively).
        run: |
          dotnet restore Tests/Tests.csproj
          dotnet build Tests/Tests.csproj -c Release --no-restore

      - name: Run tests with coverage (in-process data collector)
        shell: bash
        working-directory: target
        continue-on-error: true
        # R5 (2026-05-08): switch to in-process `dotnet test --collect "Code
        # Coverage;Format=cobertura"`, matching the proven abp/efcore/roslyn
        # pattern. Tests.csproj uses Microsoft.NET.Test.Sdk + MSTest.TestAdapter
        # (classic vstest, not MTP — confirmed in common_target_tests.props),
        # so the built-in Microsoft.CodeCoverage data collector loads inside
        # testhost at startup and avoids the wrap-mode CLR-profiler-attach
        # failure that produced 178-byte stubs in R1 / R4 (runs 25552132370,
        # 25577060633) and the empty-Module bug in R2 / R3 with coverlet.
        #
        # Flaky-test exclusions retained from R2: AsyncExtensionsTests /
        # ConnectorBasketTests fire off-by-one event-count assertions on hosted
        # Linux runners; PathsTests asserts on host paths; ReportTests compares
        # byte-exact .xml/.csv; TransactionIdStorageTests InMemory case is
        # timing-sensitive.
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          mkdir -p TestResults
          dotnet test Tests/Tests.csproj --no-build -c Release \
            --filter "FullyQualifiedName!~FunctionalTests&FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~E2E&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~Stress&FullyQualifiedName!~AsyncExtensionsTests&FullyQualifiedName!~ConnectorBasketTests&FullyQualifiedName!~PathsTests&FullyQualifiedName!~ReportTests&FullyQualifiedName!~TransactionIdStorageTests&Category!=Integration&Category!=IntegrationTest&Category!=IntegrationTests&Category!=E2E&Category!=EndToEnd&Category!=Functional&Category!=FunctionalTests&Category!=Stress&Category!=Performance&Category!=Quarantined&Category!=Flaky" \
            --collect "Code Coverage;Format=cobertura" \
            --results-directory TestResults \
            || echo "::warning::Tests in StockSharp.Tests failed or runner pressure — continuing"
          dotnet-coverage merge -r -f cobertura \
            -o TestResults/coverage.cobertura.xml \
            "TestResults/*.cobertura.xml" "TestResults/**/*.cobertura.xml" \
            || echo "merge produced no output"

      - uses: ./.github/actions/validate-cobertura
        if: always()
        with:
          working-directory: target

      - name: Disk usage (end)
        if: always()
        run: df -h

      - uses: ./.github/actions/cobertura-report-and-upload
        if: always()
        with:
          repo-name: StockSharp
          working-directory: target
          reportgenerator-version: ${{ env.REPORTGENERATOR_VERSION }}

  # ===========================================================================
  # Summary — runs after all repo jobs (success or failure)
  # ===========================================================================
  summary:
    name: "Coverage Summary"
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - abp
      - aspnetcore
      - Avalonia
      - duplicati
      - efcore
      - eShop
      - garnet
      - jellyfin
      - OpenRA
      - orleans
      - roslyn
      - runtime
      - semantic-kernel
      - server
      - StockSharp
    steps:
      - name: Print summary
        run: |
          {
            echo "## Coverage Orchestrator Results"
            echo ""
            echo "| Repository | Status |"
            echo "|---|---|"
            echo "| ABP Framework      | ${{ needs.abp.result }} |"
            echo "| ASP.NET Core       | ${{ needs.aspnetcore.result }} |"
            echo "| Avalonia           | ${{ needs.Avalonia.result }} |"
            echo "| Duplicati          | ${{ needs.duplicati.result }} |"
            echo "| EF Core            | ${{ needs.efcore.result }} |"
            echo "| eShop              | ${{ needs.eShop.result }} |"
            echo "| Garnet             | ${{ needs.garnet.result }} |"
            echo "| Jellyfin           | ${{ needs.jellyfin.result }} |"
            echo "| OpenRA             | ${{ needs.OpenRA.result }} |"
            echo "| Orleans            | ${{ needs.orleans.result }} |"
            echo "| Roslyn             | ${{ needs.roslyn.result }} |"
            echo "| .NET Runtime       | ${{ needs.runtime.result }} |"
            echo "| Semantic Kernel    | ${{ needs.semantic-kernel.result }} |"
            echo "| Server (Bitwarden) | ${{ needs.server.result }} |"
            echo "| StockSharp         | ${{ needs.StockSharp.result }} |"
            echo ""
            echo "Artifacts: coverage-report-* (HTML) and coverage-xml-* (raw cobertura)."
          } >> "$GITHUB_STEP_SUMMARY"
