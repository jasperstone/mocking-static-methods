    if: github.event.inputs.repo == 'all' || github.event.inputs.repo == 'garnet'
    steps:
      - name: Checkout orchestrator repo (for local composite actions)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: ./.github/actions/setup-workspace

      - name: Clone Garnet at pinned SHA
        run: |
          git clone --filter=blob:none https://github.com/microsoft/garnet.git target
          cd target
          git fetch --depth 1 origin 38cac99c7ad80ae8465ea6e0f120bd6698730a75
          git checkout FETCH_HEAD

      - uses: ./.github/actions/restore-nuget-cache
        with:
          repo-name: garnet
          sha-prefix: 38cac99c

      - uses: ./.github/actions/install-dotnet-coverage
        with:
          version: ${{ env.DOTNET_COVERAGE_VERSION }}

      - name: Restore Garnet.slnx
        shell: bash
