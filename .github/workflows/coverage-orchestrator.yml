          path: ~/.nuget/packages
          key: nuget-semantic-kernel-0c898161
          restore-keys: nuget-semantic-kernel-

      - name: Build Semantic Kernel
        working-directory: target/dotnet
        run: dotnet build SK-dotnet.slnx

      - name: Run tests with coverage
        working-directory: target/dotnet
        continue-on-error: true
        run: |
          dotnet test SK-dotnet.slnx --no-build \
            --filter "FullyQualifiedName!~FunctionalTests&FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~E2E&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~Stress&FullyQualifiedName!~ConformanceTests&Category!=Integration&Category!=IntegrationTest&Category!=IntegrationTests&Category!=E2E&Category!=EndToEnd&Category!=Functional&Category!=FunctionalTests&Category!=Stress&Category!=Performance&Category!=Quarantined&Category!=Flaky" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Validate cobertura has real data
        if: always()
        shell: bash
        working-directory: target/dotnet
        run: |
          shopt -s nullglob globstar
          FILES=( TestResults/coverage.cobertura.xml TestResults/**/coverage.cobertura.xml )
          BEST=""
          BEST_SIZE=0
          for f in "${FILES[@]}"; do
            [[ -f "$f" ]] || continue
            SIZE=$(stat -c%s "$f")
            if (( SIZE > BEST_SIZE )); then
              BEST="$f"
              BEST_SIZE=$SIZE
            fi
          done
          echo "Largest cobertura: ${BEST:-<none>} ($BEST_SIZE bytes)"
          if [[ -z "$BEST" ]]; then
            echo "::error::No cobertura file produced. Coverage collection failed silently."
            exit 1
          fi
          if (( BEST_SIZE < 5120 )); then
            echo "::error::Cobertura file is suspiciously small ($BEST_SIZE bytes). Likely empty stub — collector did not attach."
            exit 1
          fi
          CLASSES=$(grep -c '<class ' "$BEST" || echo 0)
          echo "Class count: $CLASSES"
          if (( CLASSES < 1 )); then
            echo "::error::Cobertura has zero <class> elements. No real coverage data."
            exit 1
          fi
          echo "✅ Cobertura validation passed: $BEST_SIZE bytes, $CLASSES classes"

      - name: Disk usage (end)
        if: always()
        run: df -h

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}
          export PATH="$PATH:/github/home/.dotnet/tools"
          reportgenerator \
            -reports:"target/dotnet/TestResults/*/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-semantic-kernel
          path: CoverageReport/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw TestResults tree (forensics)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-raw-semantic-kernel
          path: target/dotnet/TestResults/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw cobertura XML
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-xml-semantic-kernel
          path: target/dotnet/TestResults/*/coverage.cobertura.xml
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Summary — runs after all repo jobs (success or failure)
  # ===========================================================================
  summary:
    name: "Coverage Summary"
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - abp
      - aspnetcore
      - efcore
      - orleans
      - roslyn
      - runtime
      - semantic-kernel
    steps:
      - name: Print summary
        run: |
          {
            echo "## Coverage Orchestrator Results"
            echo ""
            echo "| Repository | Status |"
            echo "|---|---|"
            echo "| ABP Framework      | ${{ needs.abp.result }} |"
            echo "| ASP.NET Core       | ${{ needs.aspnetcore.result }} |"
            echo "| EF Core            | ${{ needs.efcore.result }} |"
            echo "| Orleans            | ${{ needs.orleans.result }} |"
            echo "| Roslyn             | ${{ needs.roslyn.result }} |"
            echo "| .NET Runtime       | ${{ needs.runtime.result }} |"
            echo "| Semantic Kernel    | ${{ needs.semantic-kernel.result }} |"
            echo ""
            echo "Artifacts: coverage-report-* (HTML) and coverage-xml-* (raw cobertura)."
          } >> "$GITHUB_STEP_SUMMARY"
