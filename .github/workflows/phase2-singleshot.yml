name: phase2-singleshot

on:
  workflow_dispatch:
    inputs:
      target_set:
        description: "Targets version (e.g. v1)"
        required: true
        default: "v1"
      replication:
        description: "If true, write outputs to a replica dir instead of the canonical results/ dir"
        required: false
        default: "false"
      limit:
        description: "Optional cap on number of targets per cell (for dry runs)"
        required: false
        default: ""

permissions:
  contents: read
  models: read    # gives the workflow's GITHUB_TOKEN access to models.github.ai

concurrency:
  group: "phase2-singleshot-${{ github.event.inputs.replication }}"
  cancel-in-progress: false

jobs:
  generate:
    name: "gen ${{ matrix.model }} run ${{ matrix.run_index }}"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        model:
          - anthropic/claude-opus-4-5
          - anthropic/claude-sonnet-4-5
          - openai/gpt-5
          - openai/o3
          - google/gemini-2-5-pro
        run_index: [1, 2, 3, 4, 5]
    env:
      # The built-in GITHUB_TOKEN, with `models: read` granted above, is
      # accepted by the GitHub Models endpoint. No PAT or secret needed.
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Python and pip
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip python3-yaml curl ca-certificates >/dev/null

      - name: Verify target set integrity
        shell: bash
        run: |
          set -euo pipefail
          want=$(python3 -c "import yaml; d=yaml.safe_load(open('phases/phase2-singleshot/phase.lock.yaml')); print(d['inputs'].get('targets_sha256',''))")
          have=$(sha256sum "targets/${{ inputs.target_set }}/targets.csv" | awk '{print $1}')
          if [[ -n "$want" && "$want" != "$have" ]]; then
            echo "::error::targets.csv sha256 drift: want=$want have=$have"
            exit 1
          fi
          echo "targets.csv sha256 OK: $have"

      - name: Verify GITHUB_MODELS_TOKEN is set
        shell: bash
        run: |
          if [[ -z "${GITHUB_MODELS_TOKEN:-}" ]]; then
            echo "::error::GITHUB_TOKEN was not injected; check workflow permissions block"
            exit 1
          fi
          echo "token length: ${#GITHUB_MODELS_TOKEN}"

      - name: Clone target repo at pinned SHA
        shell: bash
        env:
          MATRIX_MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          # Generation reads source files from cloned_repos/<repo>/. We don't
          # need git history — just the source tree at the pinned SHA. Use
          # codeload tarballs because (a) they accept short SHAs (git
          # protocol's `fetch <sha>` requires full SHAs and uploadpack
          # config), (b) they're a single HTTP GET each, and (c) cheaper
          # than a full clone of repos like dotnet/runtime.
          mkdir -p cloned_repos
          apt-get install -y --no-install-recommends jq >/dev/null
          python3 - <<'PY'
          import csv, json, os, pathlib, subprocess, tarfile, tempfile, urllib.request, yaml
          lock = yaml.safe_load(open("phases/phase2-singleshot/phase.lock.yaml"))
          target_set = "${{ inputs.target_set }}"
          repos_in_targets = sorted({row["repo"] for row in csv.DictReader(open(f"targets/{target_set}/targets.csv"))})
          UPSTREAM = {
            "abp": "abpframework/abp",
            "aspnetcore": "dotnet/aspnetcore",
            "Avalonia": "AvaloniaUI/Avalonia",
            "duplicati": "duplicati/duplicati",
            "efcore": "dotnet/efcore",
            "eShop": "dotnet/eShop",
            "garnet": "microsoft/garnet",
            "jellyfin": "jellyfin/jellyfin",
            "OpenRA": "OpenRA/OpenRA",
            "orleans": "dotnet/orleans",
            "roslyn": "dotnet/roslyn",
            "runtime": "dotnet/runtime",
            "semantic-kernel": "microsoft/semantic-kernel",
            "server": "bitwarden/server",
            "StockSharp": "StockSharp/StockSharp",
          }
          token = os.environ["GITHUB_MODELS_TOKEN"]  # also accepted by api.github.com
          for repo in repos_in_targets:
              sha = lock["repos"][repo]
              dest = pathlib.Path("cloned_repos") / repo
              if dest.exists():
                  continue
              slug = UPSTREAM[repo]
              url = f"https://api.github.com/repos/{slug}/tarball/{sha}"
              print(f"== fetching {repo} ({slug}@{sha})")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "phase2-singleshot",
              })
              with tempfile.NamedTemporaryFile(suffix=".tar.gz", delete=False) as tf:
                  with urllib.request.urlopen(req) as resp:
                      while True:
                          chunk = resp.read(1 << 20)
                          if not chunk:
                              break
                          tf.write(chunk)
                  tarball = tf.name
              # Tarball top-level dir is `<owner>-<repo>-<sha>/`. Strip it.
              dest.mkdir(parents=True)
              with tarfile.open(tarball, "r:gz") as tar:
                  members = tar.getmembers()
                  if not members:
                      raise SystemExit(f"empty tarball for {repo}")
                  prefix = members[0].name.split("/", 1)[0] + "/"
                  for m in members:
                      if not m.name.startswith(prefix):
                          continue
                      m.name = m.name[len(prefix):]
                      if m.name:
                          tar.extract(m, dest, filter="data")
              os.unlink(tarball)
              # Quick sanity: target file should exist for at least one row.
              n_files = sum(1 for _ in dest.rglob("*"))
              print(f"   {repo}: {n_files} entries extracted")
          PY

      - name: Run generation cell
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${{ inputs.limit }}" ]]; then
            extra+=(--limit "${{ inputs.limit }}")
          fi
          python3 tools/generation/runner.py \
            --phase phase2-singleshot \
            --model "${{ matrix.model }}" \
            --run-index "${{ matrix.run_index }}" \
            --target-set "${{ inputs.target_set }}" \
            "${extra[@]}"

      - name: Sanitize artifact name
        id: sanitize
        shell: bash
        env:
          MATRIX_MODEL: ${{ matrix.model }}
        run: |
          slug="${MATRIX_MODEL//\//__}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Upload cell artifact
        uses: actions/upload-artifact@v4
        with:
          name: "gen-${{ steps.sanitize.outputs.slug }}-run${{ matrix.run_index }}"
          path: "phases/phase2-singleshot/results/"
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: "assemble all cells"
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all cell artifacts
        uses: actions/download-artifact@v4
        with:
          path: phases/phase2-singleshot/results/
          pattern: "gen-*"
          merge-multiple: true

      - name: Verify all 25 cells uploaded
        shell: bash
        run: |
          set -euo pipefail
          ls -la "phases/phase2-singleshot/results/"
          count=$(find "phases/phase2-singleshot/results/" -name "attempts.jsonl" | wc -l)
          echo "found $count attempts.jsonl files"
          if [[ "$count" -ne 25 ]]; then
            echo "::error::expected 25 cell attempts.jsonl files; got $count"
            exit 1
          fi

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: "phase2-singleshot-results-pre-coverage"
          path: "phases/phase2-singleshot/results/"
          retention-days: 90
