# Snapshot of every input that affects this phase's reproducibility.

phase:
  id: phase2-agentic
  title: "Agentic loop with read_file / list_dir / submit_test tools"
  strategy: |
    Each model runs in a multi-turn loop (max 6 turns, max 5 reads). The model
    can call read_file(path), list_dir(path), or submit_test(csharp). Same
    prompt for all 7 panel models, dispatched to the natural API surface for
    each deployment (Azure OpenAI Chat Completions, Azure OpenAI Responses, or
    Foundry Models Inference).
