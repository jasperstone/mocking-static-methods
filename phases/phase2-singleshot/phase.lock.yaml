phase:
  id: phase2-singleshot
  title: "Single-shot test generation against 3,147 Mode#1 sites"
  strategy: >
    For each Mode#1 static-call site in targets/v1/targets.csv, send the
    target file to each model in the panel and ask for unit tests. One
    request per (model, run, target). No iteration, no feedback loop, no
    tools — naive single-shot baseline that mirrors what a developer
    would paste into Copilot Chat.
  start_date: "2026-05-09"
  seal_date: ""
  git_tag: ""

inputs:
  targets_version: "v1"
  targets_sha256: "aca60f388a4c82c8af021a76ea47a443838b7edb6a7992fe21f9fe3afe8d5e10"
  targets_count: 3147

