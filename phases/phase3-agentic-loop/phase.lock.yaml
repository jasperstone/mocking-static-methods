# Snapshot of every input that affects this phase's reproducibility.

phase:
  id: phase3-agentic-loop
  title: "Agentic loop with in-loop compile + run feedback (fix-up iterations)"
  strategy: |
    Same text-based tool protocol as phase 2 (read_file / list_dir /
    submit_test) but with one structural change: after each submit_test,
    the runner compiles the candidate against the production project AND
    runs `dotnet test` on it. If compilation fails, the first compile
    errors are fed back. If compilation succeeds but tests fail or throw,
    the test failures (message + stack tail) are fed back. The model may
    then read more files and submit a revised version. Budget: max 12
    turns, max 8 reads, max 4 submit_test cycles. Same 6-model panel as
    phase 2 v2 sweep (no codex).
  start_date: "2026-05-13"
  seal_date: ""
  git_tag: ""

inputs:
  targets_version: "v2"
  targets_sha256: "4db523f966ff24a469895a105db6dd011fc22bd52f401c4b5fbe83d905bb2823"
  targets_count: 300         # SAME cells as phase2-agentic v2 sweep — no resampling

