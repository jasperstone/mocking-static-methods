  budget_alert_amount_usd: 250
  budget_alert_resource_group: "rg-mocking-static-experiment"
  account_name: "foundry-mockstatic"
  notes: |
    Budget alert "phase4-tripwire-250" — emails on 50/75/90% actual +
    100% forecast. $250 is a $40 headroom over the $210 PLAN.md
    projection. Same Foundry account as phases 2 and 3 — phase 3 spend
    ($82.19) is already booked against this account; the phase 4 budget
    is on top.

