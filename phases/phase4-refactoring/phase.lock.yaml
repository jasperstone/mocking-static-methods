# Snapshot of every input that affects this phase's reproducibility.
# Phase 4 — Agentic loop + testability refactoring tool (single writer agent)
#
# STATUS: scaffold only. No production runs yet.
# DISPATCH GATE: no real Foundry dispatch before the run_1 go/no-go.

phase:
  id: phase4-refactoring
  title: "Agentic loop + testability refactoring tool (single writer + apply_refactor)"
  strategy: |
    The proven phase-3 single writer agent, given one new capability: a
    local apply_refactor tool that introduces a testability seam into
    production source so an unmockable Mode #1 static call site becomes
    mockable. The writer uses the same text-based tool protocol as phases
    2 and 3 (read_file / list_dir / submit_test) plus apply_refactor. The
    refactor is drawn from a fixed three-item menu (make_virtual,
    wrapper_interface, parameterize_dependency) — NOT free-form prod
    editing; the bounded menu is the anti-gaming mechanism. A
    behavior-preservation guard rebuilds the owning csproj (and runs any
    existing tests) after each refactor; on failure the edit is
    auto-reverted (refactor_rejected). Every production file touched is
    snapshotted before its first edit and restored to pristine state after
    the cell, so cells never contaminate one another. Same 6-model panel
    and same v2 target set (300 cells, frozen SHAs) as phase 3 — phase 4
    is an A/B against phase 3 on the refactoring capability alone. There
    is NO reviewer or fixer; phase 4 is single-agent.
  start_date: "2026-06-11"
  seal_date: ""
  git_tag: ""

