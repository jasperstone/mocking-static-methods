  roslyn:          "02d301627ed5016a4c18acd1a35e5bbc20ff03f0"
  semantic-kernel: "1fe41e17a90e002aa7f4f834f7ebd9475d80803c"
  server:          "ea233580d24734f78feffe7fa5cef185b1a2df28"

generation:
  endpoint: "https://foundry-mockstatic.cognitiveservices.azure.com/"
  endpoint_kind: "Azure AI Foundry (single account, three API surfaces)"
  region: "eastus2"

  surfaces:
    openai_chat:        ["gpt-4.1-mini", "gpt-4.1-nano"]
    foundry_inference:  ["phi-4", "codestral-2501", "llama-3.3-70b-instruct", "grok-4-1-fast"]

  # Single writer agent per cell. No reviewer / fixer roles.
  models:
    - id: "gpt-4.1-mini"
    - id: "gpt-4.1-nano"
    - id: "phi-4"
    - id: "codestral-2501"
    - id: "llama-3.3-70b-instruct"
    - id: "grok-4-1-fast"

  runs_per_model: 1          # run_1 = the go/no-go dispatch; runs 2+3 follow if cleared
  temperature: 0.0
  top_p: 1.0
  seed: 42
  max_output_tokens: 4096

  model_snapshots_observed: {}

  agent_topology: single_writer_refactor

  prompt_template_dir: "prompt/"
  prompt_writer_system_sha256: ""    # filled at first successful run
  prompt_user_template_sha256: ""    # filled at first successful run

  # Single-agent turn budgets — phase-3 base plus headroom for refactor turns.
  writer_max_turns: 12
  writer_max_reads: 8

  agent_max_attempts: 4            # max submit_test cycles across whole task
  agent_run_timeout_s: 60          # per-submission `dotnet test` cap

  agent_tools_allowed:
    - read_file
    - list_dir
    - apply_refactor
    - submit_test
  agent_feedback_kind: "compile_and_run"

# Refactoring capability — the only difference from phase 3.
refactoring:
  tool: apply_refactor
  tool_kind: "local (no LLM); edits production source"
  transform_menu:
    - id: make_virtual
      applies_to: ["NonVirtual"]
      effect: "mark target instance method virtual (extract-and-override seam)"
    - id: wrapper_interface           # a.k.a. extract-and-adapter
      applies_to: ["EXT", "NonVirtual"]
      effect: "generate adapter interface + thin wrapper; consumer depends on interface (ctor-injected)"
    - id: parameterize_dependency
      applies_to: ["EXT", "NonVirtual"]
      effect: "inject dependency via NEW defaulted overload; preserves existing public API"
  guard:
    behavior_preservation: true
    must_build_owning_project: true
    existing_tests_must_pass: true   # only when the owning project has an associated test project
    on_failure: "auto_revert + record refactor_rejected"
  anti_gaming:
    no_delete_disable_or_noop_target: true
    no_observable_behavior_change: true
    parameterize_keeps_default_overload: true
    edits_confined_to_owning_csproj_subtree: true
  legitimate_pass:
    must_exercise_target_via_seam: true
    must_assert_real_behavior: true
    no_trivial_assert: true
    no_bypass_of_target_site: true
  lifecycle:
    snapshot: "snapshot-on-write (lazy) of any prod file before first edit"
    rebuild: "compile+run rebuilds the single owning csproj from source"
    restore: "unconditional restore of all touched files to pristine state after each cell"

ci_runs:
